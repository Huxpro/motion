<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Motion × Lynx — Lynx for Web</title>
        <link rel="stylesheet" href="/lynx/static/css/client.css" />
        <script>
            ;(() => {
                const query = new URLSearchParams(window.location.search)
                if (query.get("embed") !== "1") return

                const requestedHeight = Number(query.get("height"))
                const height = Number.isFinite(requestedHeight)
                    ? Math.min(10000, Math.max(900, requestedHeight))
                    : 1300
                document.documentElement.classList.add("embedded")
                document.documentElement.style.setProperty(
                    "--gallery-content-height",
                    `${height}px`
                )
            })()
        </script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: #0b0b14;
            }
            lynx-view {
                display: block;
                width: 100vw;
                height: 100vh;
            }
            html.embedded,
            html.embedded body {
                min-height: var(--gallery-content-height);
                overflow-y: auto;
            }
            html.embedded lynx-view {
                height: var(--gallery-content-height);
            }
        </style>
        <script type="module" src="/lynx/static/js/client.js"></script>
    </head>
    <body>
        <lynx-view
            url="/lynx/main.web.bundle"
            style="width: 100vw"
        ></lynx-view>
        <script>
            ;(() => {
                if (!document.documentElement.classList.contains("embedded")) {
                    return
                }

                const channel = "motion-lynx-compare"
                let applyingSync = false
                const root = () =>
                    document.scrollingElement || document.documentElement

                window.addEventListener(
                    "scroll",
                    () => {
                        if (applyingSync) return
                        const range = Math.max(
                            0,
                            root().scrollHeight - window.innerHeight
                        )
                        window.parent.postMessage(
                            {
                                channel,
                                type: "scroll",
                                progress:
                                    range === 0 ? 0 : root().scrollTop / range,
                            },
                            "*"
                        )
                    },
                    { passive: true }
                )

                window.addEventListener("message", (event) => {
                    const message = event.data
                    if (event.source !== window.parent || !message) return
                    if (
                        message.channel === channel &&
                        message.type === "resize" &&
                        typeof message.height === "number"
                    ) {
                        const height = Math.min(
                            10000,
                            Math.max(900, Math.ceil(message.height))
                        )
                        document.documentElement.style.setProperty(
                            "--gallery-content-height",
                            `${height}px`
                        )
                        return
                    }
                    if (
                        message.channel !== channel ||
                        message.type !== "sync" ||
                        typeof message.progress !== "number"
                    ) {
                        return
                    }

                    const range = Math.max(
                        0,
                        root().scrollHeight - window.innerHeight
                    )
                    applyingSync = true
                    window.scrollTo(
                        0,
                        range * Math.min(1, Math.max(0, message.progress))
                    )
                    requestAnimationFrame(() => {
                        applyingSync = false
                    })
                })
            })()
        </script>
    </body>
</html>
